<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Tracker | NEXORA</title>
  <meta name="description" content="Track college assignments, submission deadlines, and coursework status.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/assets/nexora-icon.png">
</head>
<body>

  <div class="sidebar-overlay"></div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Sidebar Navigation">
      <div class="sidebar-brand">
        <img src="/assets/nexora-logo.png" alt="NEXORA Logo" class="brand-logo">
        <span class="brand-title">NEXORA</span>
      </div>

      <nav class="sidebar-menu">
        <div class="nav-heading">Main Menu</div>
        <a href="/dashboard" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="/tasks" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tasks
        </a>
        <a href="/assignments" class="nav-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Assignments
        </a>
        <a href="/notes" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Notes
        </a>
        <a href="/timetable" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Timetable
        </a>
        <a href="/exams" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Exams
        </a>
        <a href="/expenses" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          Expenses
        </a>
        <a href="/progress" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Progress
        </a>

        <div class="nav-heading" style="margin-top: 10px;">Account</div>
        <a href="/profile" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar-badge" id="sidebarAvatarBadge">S</div>
          <div class="user-snippet-info">
            <div class="user-snippet-name" id="sidebarUserName">Student</div>
            <div class="user-snippet-course">Active Session</div>
          </div>
          <a href="#" class="logout-btn-mini logout-trigger" title="Sign Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </a>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title">Assignment Tracker</h1>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" onclick="openAddAssignmentModal()">+ Add Assignment</button>
        </div>
      </header>

      <main class="content-body">
        <!-- Summary Stats -->
        <div class="stats-grid" style="margin-bottom: 20px;">
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(139,92,246,0.15); color: var(--primary);">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="stat-info">
              <div class="stat-value" id="assignStatTotal">0</div>
              <div class="stat-label">Total Assignments</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(245,158,11,0.15); color: var(--warning);">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-info">
              <div class="stat-value" id="assignStatPending">0</div>
              <div class="stat-label">Pending</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(16,185,129,0.15); color: var(--success);">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="stat-info">
              <div class="stat-value" id="assignStatCompleted">0</div>
              <div class="stat-label">Submitted</div>
            </div>
          </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-bar">
          <div class="tab-group">
            <button class="tab-btn assignment-filter-tab active" data-filter="All">All Assignments</button>
            <button class="tab-btn assignment-filter-tab" data-filter="Pending">Pending</button>
            <button class="tab-btn assignment-filter-tab" data-filter="Completed">Completed</button>
          </div>
        </div>

        <!-- Assignments Grid -->
        <div id="assignmentsGridContainer" class="assignments-grid">
          <div class="empty-state"><p class="empty-description">Loading assignments...</p></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Assignment Modal -->
  <div class="modal-backdrop" id="assignmentModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="assignModalTitle">Add New Assignment</h3>
        <button class="modal-close" onclick="closeModal('assignmentModal')" aria-label="Close modal">✕</button>
      </div>
      <form id="assignmentForm">
        <div class="modal-body">
          <div class="form-group">
            <label for="assignTitle" class="form-label">Assignment Title *</label>
            <input type="text" id="assignTitle" class="form-input" placeholder="e.g. Operating Systems CPU Scheduling Lab" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="assignSubject" class="form-label">Subject *</label>
              <input type="text" id="assignSubject" class="form-input" placeholder="e.g. Operating Systems" required>
            </div>
            <div class="form-group">
              <label for="assignSubmissionDate" class="form-label">Submission Date *</label>
              <input type="date" id="assignSubmissionDate" class="form-input" required>
            </div>
          </div>

          <div class="form-group">
            <label for="assignDescription" class="form-label">Description / Guidelines</label>
            <textarea id="assignDescription" class="form-textarea" placeholder="Questions, submission format, or notes..."></textarea>
          </div>

          <div class="form-group" id="assignStatusGroup" style="display: none;">
            <label for="assignStatusEdit" class="form-label">Status</label>
            <select id="assignStatusEdit" class="form-select">
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('assignmentModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Assignment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/assignments.js"></script>
</body>
</html>
