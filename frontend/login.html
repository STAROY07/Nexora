<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | NEXORA</title>
  <meta name="description" content="Sign in to your NEXORA student account to access your dashboard, tasks, timetable, notes, and exams.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/assets/nexora-icon.png">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/">
          <img src="/assets/nexora-logo.png" alt="NEXORA Logo" class="auth-logo">
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your student workspace</p>
      </div>

      <!-- Demo Account Quick Access -->
      <div class="demo-box">
        <div class="demo-box-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Instant Demo Account
        </div>
        <div class="demo-box-creds" style="margin-bottom: 10px;">
          Email: demo@nexora.com &nbsp;|&nbsp; Pass: demo123
        </div>
        <a href="/api/auth/demo-login" class="btn btn-demo btn-sm" style="width: 100%;">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          1-Click Demo Login
        </a>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="student@college.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
