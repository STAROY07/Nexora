<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Manager | NEXORA</title>
  <meta name="description" content="Manage study notes, revision pointers, and subject-wise reference materials.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/assets/nexora-icon.png">
</head>
<body>

  <div class="sidebar-overlay"></div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Sidebar Navigation">
      <div class="sidebar-brand">
        <img src="/assets/nexora-logo.png" alt="NEXORA Logo" class="brand-logo">
        <span class="brand-title">NEXORA</span>
      </div>

      <nav class="sidebar-menu">
        <div class="nav-heading">Main Menu</div>
        <a href="/dashboard" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="/tasks" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tasks
        </a>
        <a href="/assignments" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Assignments
        </a>
        <a href="/notes" class="nav-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Notes
        </a>
        <a href="/timetable" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Timetable
        </a>
        <a href="/exams" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Exams
        </a>
        <a href="/expenses" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          Expenses
        </a>
        <a href="/progress" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Progress
        </a>

        <div class="nav-heading" style="margin-top: 10px;">Account</div>
        <a href="/profile" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar-badge" id="sidebarAvatarBadge">S</div>
          <div class="user-snippet-info">
            <div class="user-snippet-name" id="sidebarUserName">Student</div>
            <div class="user-snippet-course">Active Session</div>
          </div>
          <a href="#" class="logout-btn-mini logout-trigger" title="Sign Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </a>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title">Notes Manager</h1>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" onclick="openAddNoteModal()">+ Create Note</button>
        </div>
      </header>

      <main class="content-body">
        <!-- Search & Filter Bar -->
        <div class="filter-bar">
          <div style="flex: 1; min-width: 240px;">
            <input type="text" id="noteSearchInput" class="form-input" placeholder="🔍 Search notes by title, keyword, or subject...">
          </div>

          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <select id="noteSubjectFilter" class="form-select" style="width: auto; padding: 8px 14px; font-size: 0.88rem;">
              <option value="All">All Subjects</option>
            </select>

            <button id="importantNotesToggle" class="btn btn-secondary btn-sm" style="height: 42px;">
              ★ Important Only
            </button>
          </div>
        </div>

        <!-- Notes Grid -->
        <div id="notesGridContainer" class="notes-grid">
          <div class="empty-state"><p class="empty-description">Loading notes...</p></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create / Edit Note Modal -->
  <div class="modal-backdrop" id="noteModal">
    <div class="modal-card" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title" id="noteModalTitle">Create New Note</h3>
        <button class="modal-close" onclick="closeModal('noteModal')" aria-label="Close modal">✕</button>
      </div>
      <form id="noteForm">
        <div class="modal-body">
          <div class="form-group">
            <label for="noteTitleInput" class="form-label">Note Title *</label>
            <input type="text" id="noteTitleInput" class="form-input" placeholder="e.g. Binary Search Trees & AVL Rotations" required>
          </div>

          <div class="form-group">
            <label for="noteSubjectInput" class="form-label">Subject / Topic</label>
            <input type="text" id="noteSubjectInput" class="form-input" placeholder="e.g. Data Structures & Algorithms">
          </div>

          <div class="form-group">
            <label for="noteContentInput" class="form-label">Note Content *</label>
            <textarea id="noteContentInput" class="form-textarea" style="min-height: 160px;" placeholder="Write your key points, definitions, formulas, or summaries..." required></textarea>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
            <input type="checkbox" id="noteImportantInput" style="width: 18px; height: 18px; accent-color: var(--primary);">
            <label for="noteImportantInput" style="font-size: 0.88rem; color: var(--text-main); cursor: pointer;">Mark as Important / Starred</label>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('noteModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Note Full Content Modal -->
  <div class="modal-backdrop" id="viewNoteModal">
    <div class="modal-card" style="max-width: 640px;">
      <div class="modal-header">
        <div>
          <span class="badge badge-subject" id="viewNoteSubject">Subject</span>
          <h3 class="modal-title" id="viewNoteTitle" style="margin-top: 6px;">Note Title</h3>
        </div>
        <button class="modal-close" onclick="closeModal('viewNoteModal')" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body">
        <div id="viewNoteContent" style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.7; color: var(--text-main); background: var(--bg-input); padding: 18px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);"></div>
        <div style="font-size: 0.78rem; color: var(--text-dim); margin-top: 14px; text-align: right;">
          Last updated: <span id="viewNoteDate">-</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('viewNoteModal')">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/notes.js"></script>
</body>
</html>
